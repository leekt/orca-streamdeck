[package]
name = "herdr-streamdeck"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Stream Deck controls for local and remote Herdr agents"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
elgato-streamdeck = { version = "0.13", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
fontdue = "0.9"
md-5 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
wait-timeout = "0.2"
plist = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSEvent", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSDate", "NSString", "NSRunLoop", "NSThread"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
